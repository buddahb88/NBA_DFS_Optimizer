# NBA DFS Database Schema
# This file describes the complete database structure for the AI assistant

# AVAILABLE TABLES OVERVIEW:
# 1. players - Core player data with projections, stats, salaries, and matchup metrics
# 2. slates - DFS contest slate information
# 3. lineups - Saved DFS lineups
# 4. lineup_players - Junction table linking players to lineups
# 5. chat_sessions - AI chat conversation sessions
# 6. chat_messages - Individual chat messages
# 7. team_defense_rankings - Team defensive efficiency, pace, and advanced stats (from ESPN)
# 8. team_defense_vs_position - Legacy position DVP from HashtagBasketball (REAL points allowed, not fantasy points)
# 9. historical_games - ESPN box-score game logs, 2024-25 season onward (keyed by player_key)
# 10. slate_player_snapshots - Saved copy of every synced slate's player rows (past salaries/projections/ownership)
# 11. player_season_profiles - Per-season role profile per player (usage, assist rate, rebound rate, per-36)
# 12. player_archetypes - Per-season archetype per player, classified from player_season_profiles
# 13. team_archetype_defense - How each defense performs vs each archetype / G-F-C position, relative to expectation
#
# KEY MATCHUP ANALYSIS TABLES:
# - team_archetype_defense: THE matchup table. fp_over_expectation = fantasy points per player-game a
#   defense allows above (+) or below (-) what those players normally score. This is what the projections use.
# - team_defense_rankings: Overall team defense quality (def_eff), pace, offensive efficiency
# - team_defense_vs_position / players.dvp_pts_allowed: legacy HashtagBasketball real points allowed per position
# - players.opp_def_eff: Pre-joined defensive efficiency for each player's opponent
#
# History tables are keyed by player_key, the accent/punctuation/suffix-free name ('luka doncic', 'jaren jackson').
# Resolve a player's name to player_key with the chat tools or the player_key utility (utils/playerKey.js), not SQL.
# Example queries that join players to history on name are slate-wide approximations.

tables:
  slates:
    description: "DFS contest slates (Main, Showdown, etc.)"
    columns:
      - name: id
        type: INTEGER
        description: "Auto-increment primary key"
      - name: slate_id
        type: TEXT
        description: "RotoWire slate identifier (e.g., '26155')"
      - name: name
        type: TEXT
        description: "Slate name (e.g., 'Main Slate', 'Showdown')"
      - name: sport
        type: TEXT
        description: "Sport type"
        default: "NBA"
      - name: start_time
        type: DATETIME
        description: "Slate start time"
      - name: created_at
        type: DATETIME
        description: "Record creation timestamp"
      - name: updated_at
        type: DATETIME
        description: "Last update timestamp"

    example_queries:
      - "SELECT * FROM slates ORDER BY created_at DESC LIMIT 1"
      - "SELECT slate_id, name FROM slates WHERE name LIKE '%Main%'"

  players:
    description: "NBA players with projections, stats, and DFS metrics"
    columns:
      # Identity
      - name: id
        type: INTEGER
        description: "Auto-increment primary key"
      - name: slate_id
        type: TEXT
        description: "Foreign key to slates.slate_id"
      - name: player_id
        type: TEXT
        description: "RotoWire player identifier"
      - name: name
        type: TEXT
        description: "Player full name (e.g., 'LeBron James')"
      - name: team
        type: TEXT
        description: "Team abbreviation (e.g., 'LAL', 'BOS', 'GSW')"
      - name: opponent
        type: TEXT
        description: "Opponent team abbreviation"
      - name: position
        type: TEXT
        description: "Eligible positions, comma-separated (e.g., 'PG,SG', 'SF,PF')"
        valid_values: ["PG", "SG", "SF", "PF", "C", "PG,SG", "SF,PF", etc.]

      # DFS Core
      - name: salary
        type: INTEGER
        description: "DraftKings salary (e.g., 10500 = $10,500)"
        range: [3000, 12000]
      - name: projected_points
        type: REAL
        description: "Projected fantasy points (weighted average of recent performance)"
        range: [0, 80]
      - name: projected_minutes
        type: REAL
        description: "Projected playing time in minutes"
        range: [0, 48]
      - name: value
        type: REAL
        description: "Cash game value metric (points per $1000 salary, with ownership adjustments)"
        calculation: "(projected_points / salary) * 1000 * bonuses"
      - name: value_gpp
        type: REAL
        description: "GPP/Tournament value metric (rewards low ownership for leverage)"
        calculation: "value * ownership_multiplier (low_owned = 1.15x, high_owned = 0.92x)"

      # Status & Game Info
      - name: game_info
        type: TEXT
        description: "Game matchup string (e.g., 'LAL vs BOS')"
      - name: injury_status
        type: TEXT
        description: "Injury designation from RotoWire"
        valid_values: [null, "GTD", "Questionable", "Doubtful", "OUT", "Probable"]
        notes: |
          - NULL or empty = healthy/active player
          - To find healthy players: WHERE injury_status IS NULL OR injury_status = ''
          - To exclude injured: WHERE injury_status NOT IN ('OUT', 'Doubtful') OR injury_status IS NULL
      - name: headshot
        type: TEXT
        description: "URL to player headshot image"
        example: "https://content.rotowire.com/images/headshots/nba/imagn-796436.jpg"

      # Recent Performance
      - name: fpts_last3
        type: REAL
        description: "Average fantasy points over last 3 games"
      - name: fpts_last5
        type: REAL
        description: "Average fantasy points over last 5 games"
      - name: fpts_last7
        type: REAL
        description: "Average fantasy points over last 7 games"
      - name: fpts_last14
        type: REAL
        description: "Average fantasy points over last 14 games"

      # Advanced Stats
      - name: per
        type: REAL
        description: "Player Efficiency Rating (higher = more efficient)"
        range: [0, 35]
        notes: "20+ is excellent, 15-20 is good, <10 is poor"
      - name: usage
        type: REAL
        description: "Usage rate % (percentage of team plays used by player)"
        range: [0, 45]
        notes: "30+ is high usage, 20-25 is medium, <15 is low"
      - name: rest_days
        type: INTEGER
        description: "Number of days since last game (0 = back-to-back)"
        range: [0, 7]
        notes: "0 = B2B (more fatigue), 1 = normal rest, 2+ = extra rest"

      # Defensive Matchup Data
      - name: dvp_pts_allowed
        type: REAL
        description: "Legacy DVP - real points (not fantasy points) the opponent allows per game to this player's primary position (HashtagBasketball)"
        range: [18, 28]
        notes: "Higher = easier, but the spread between teams is only a few points. For matchups prefer team_archetype_defense.fp_over_expectation"
      - name: opp_def_eff
        type: REAL
        description: "Opponent's overall defensive efficiency (from team_defense_rankings)"
        range: [102, 124]
        notes: "Higher = weaker defense. >118 = great matchup, 108-118 = average, <108 = tough"

      # Vegas Betting Data
      - name: vegas_implied_total
        type: REAL
        description: "Team's implied total points from Vegas line"
        range: [90, 140]
        notes: "115+ is high-scoring game environment"
      - name: vegas_spread
        type: REAL
        description: "Point spread (negative = favorite, positive = underdog)"
        range: [-15, 15]
        notes: "< -7 = big favorite, > +7 = big underdog"
      - name: vegas_over_under
        type: REAL
        description: "Game total over/under line"
        range: [200, 250]
        notes: "230+ is very high pace, <215 is low pace"
      - name: vegas_win_prob
        type: REAL
        description: "Implied win probability percentage"
        range: [0, 100]

      # DFS Tournament Data
      - name: rostership
        type: REAL
        description: "Projected ownership percentage in GPP tournaments"
        range: [0, 100]
        notes: |
          - <5% = very low owned (leverage play)
          - 5-15% = medium-low owned
          - 15-30% = popular play
          - >30% = chalk (very high owned)

      # Advanced Projection Metrics (Variance & Risk Analysis)
      - name: floor
        type: REAL
        description: "15th percentile of the player's projected DK outcome distribution (~15% of games score below it)"
        calculation: "game-log points-per-minute x minutes distribution around the projection (services/variance/outcomeDistribution.js)"
        notes: "Use for cash game safety analysis. Higher floor = safer play"
      - name: ceiling
        type: REAL
        description: "85th percentile of the player's projected DK outcome distribution (~15% of games score above it)"
        calculation: "same distribution as floor; blowout risk widens it"
        notes: "Use for GPP tournament upside analysis. Higher ceiling = more boom potential"
      - name: volatility
        type: REAL
        description: "Coefficient of variation (std_dev / mean)"
        range: [0, 1.5]
        notes: |
          - <0.30 = consistent (heavy-minute starters; good for cash)
          - 0.30-0.45 = moderate variance
          - >0.45 = high variance/boom-bust (low-minute and bench roles; GPP with low ownership)
      - name: boom_probability
        type: REAL
        description: "Percentage chance of scoring 5x salary/1000 + 10 or more"
        range: [0, 100]
        notes: |
          - ≥25% = high boom potential (great for GPP)
          - 10-25% = moderate boom chance
          - <10% = low upside
      - name: bust_probability
        type: REAL
        description: "Percentage chance of scoring under 5x salary/1000 (about 65% of all slate players do)"
        range: [0, 100]
        notes: |
          - <40% = safe play (good for cash)
          - 40-60% = moderate bust risk
          - >60% = high bust risk (avoid in cash, use sparingly in GPP)
      - name: fppm
        type: REAL
        description: "Weighted fantasy points per minute (40% L3, 30% L5, 30% season)"
        notes: "Measures current efficiency better than season averages"
      - name: leverage_score
        type: REAL
        description: "GPP leverage score: boom_probability / (ownership + 1)"
        notes: |
          - ≥3.0 = high leverage (great GPP play - low owned with boom potential)
          - 1.0-3.0 = moderate leverage
          - <1.0 = low leverage (chalky or low upside)
          - Best GPP strategy: target players with leverage ≥ 3.0
      - name: blowout_risk
        type: REAL
        description: "Blowout risk magnitude based on spread"
        notes: "Triggers when |spread| > 10. Favorites risk early pulls, underdogs get garbage time"
      - name: std_dev
        type: REAL
        description: "Standard deviation of the projected DK outcome distribution (same model as floor/ceiling)"
        notes: "Higher std_dev = more variance (boom/bust potential)"

      # Metadata
      - name: raw_data
        type: TEXT
        description: "JSON string of original RotoWire data"
      - name: created_at
        type: DATETIME
      - name: updated_at
        type: DATETIME

    indexes:
      - "idx_players_slate_id ON players(slate_id)"
      - "idx_players_position ON players(position)"
      - "idx_players_salary ON players(salary)"

    common_filters:
      healthy_players: "WHERE (injury_status IS NULL OR injury_status = '')"
      active_starters: "WHERE projected_minutes >= 25 AND (injury_status IS NULL OR injury_status = '')"
      value_plays: "WHERE value >= 5.0 AND projected_points >= 20"
      high_upside: "WHERE projected_points >= 40 AND usage >= 25"
      punt_plays: "WHERE salary <= 4000 AND projected_minutes >= 15"
      game_stack: "WHERE team = 'LAL' OR opponent = 'LAL'"
      high_total_games: "WHERE vegas_over_under >= 230"
      leverage_plays: "WHERE rostership <= 10 AND projected_points >= 30"
      chalk_plays: "WHERE rostership >= 25"
      weak_defense: "WHERE opp_def_eff > 118"
      elite_defense: "WHERE opp_def_eff < 108"
      # Advanced metric filters
      safe_cash_plays: "WHERE floor >= 30 AND volatility < 0.30 AND bust_probability < 45"
      high_ceiling_gpp: "WHERE ceiling >= 50 AND boom_probability >= 25"
      elite_leverage: "WHERE leverage_score >= 3.0 AND boom_probability >= 20"
      consistent_producers: "WHERE volatility < 0.30 AND floor >= 25"
      boom_bust_candidates: "WHERE volatility >= 0.45 AND ceiling >= 45"

    example_queries:
      basic:
        - description: "Top 10 players by projection"
          query: "SELECT name, team, salary, projected_points, position FROM players WHERE (injury_status IS NULL OR injury_status = '') ORDER BY projected_points DESC LIMIT 10"

        - description: "Best value guards under $7k"
          query: "SELECT name, salary, projected_points, value FROM players WHERE (position LIKE '%PG%' OR position LIKE '%SG%') AND salary <= 7000 AND (injury_status IS NULL OR injury_status = '') ORDER BY value DESC LIMIT 10"

        - description: "High usage, low ownership plays"
          query: "SELECT name, salary, usage, rostership, projected_points FROM players WHERE usage >= 28 AND rostership <= 15 AND (injury_status IS NULL OR injury_status = '') ORDER BY value_gpp DESC LIMIT 10"

        - description: "Players in high-scoring games"
          query: "SELECT name, team, opponent, vegas_implied_total, vegas_over_under, projected_points FROM players WHERE vegas_over_under >= 225 AND (injury_status IS NULL OR injury_status = '') ORDER BY projected_points DESC"

        - description: "Punt plays with upside"
          query: "SELECT name, salary, projected_points, projected_minutes, fpts_last3 FROM players WHERE salary <= 4500 AND projected_minutes >= 20 AND fpts_last3 >= 15 AND (injury_status IS NULL OR injury_status = '')"

        - description: "Best archetype matchups tonight (defense allows the most fantasy points over expectation to the player's archetype)"
          query: |
            SELECT p.name, p.position, p.opponent, p.salary, p.projected_points, a.archetype,
                   ROUND(d.fp_over_expectation, 2) AS fp_over_expectation, d.games, d.season
            FROM players p
            JOIN player_season_profiles sp ON (sp.player_key = LOWER(p.name) OR sp.player_name = p.name)
            JOIN player_archetypes a ON a.player_key = sp.player_key AND a.season = sp.season
            JOIN team_archetype_defense d ON d.team = p.opponent AND d.season = a.season
              AND d.site = 'draftkings' AND d.group_by = 'archetype' AND d.group_key = a.archetype
            WHERE d.season = (SELECT season FROM team_archetype_defense
                              WHERE group_by = 'position' AND site = 'draftkings' AND games >= 10
                              GROUP BY season HAVING COUNT(DISTINCT team) >= 20
                              ORDER BY season DESC LIMIT 1)
              AND (p.injury_status IS NULL OR p.injury_status = '')
            ORDER BY d.fp_over_expectation DESC LIMIT 15

        - description: "Value plays facing weak defenses"
          query: "SELECT name, salary, value, projected_points, opp_def_eff FROM players WHERE value >= 5.5 AND opp_def_eff > 118 AND (injury_status IS NULL OR injury_status = '') ORDER BY value DESC"

      advanced_metrics:
        - description: "Safe cash game plays (high floor, low volatility, low bust risk)"
          query: "SELECT name, salary, projected_points, floor, ceiling, volatility, bust_probability FROM players WHERE floor >= 30 AND volatility < 0.30 AND bust_probability < 45 AND (injury_status IS NULL OR injury_status = '') ORDER BY floor DESC LIMIT 15"

        - description: "Elite GPP leverage plays (low owned + high boom potential)"
          query: "SELECT name, salary, projected_points, leverage_score, boom_probability, rostership, ceiling FROM players WHERE leverage_score >= 3.0 AND boom_probability >= 20 AND (injury_status IS NULL OR injury_status = '') ORDER BY leverage_score DESC LIMIT 15"

        - description: "High ceiling tournament plays"
          query: "SELECT name, salary, projected_points, ceiling, boom_probability, volatility, rostership FROM players WHERE ceiling >= 50 AND boom_probability >= 25 AND (injury_status IS NULL OR injury_status = '') ORDER BY ceiling DESC LIMIT 10"

        - description: "Consistent producers (low variance, high floor)"
          query: "SELECT name, salary, floor, ceiling, volatility, projected_points FROM players WHERE volatility < 0.30 AND floor >= 25 AND projected_minutes >= 28 AND (injury_status IS NULL OR injury_status = '') ORDER BY floor DESC"

        - description: "Boom/bust candidates with upside"
          query: "SELECT name, salary, floor, ceiling, volatility, boom_probability, leverage_score FROM players WHERE volatility >= 0.45 AND ceiling >= 45 AND leverage_score >= 2.0 AND (injury_status IS NULL OR injury_status = '') ORDER BY leverage_score DESC"

        - description: "Compare floor vs ceiling spread for risk assessment"
          query: "SELECT name, salary, projected_points, floor, ceiling, (ceiling - floor) as spread, volatility, boom_probability FROM players WHERE projected_minutes >= 25 AND (injury_status IS NULL OR injury_status = '') ORDER BY spread DESC LIMIT 15"

        - description: "Low-owned high-ceiling plays for GPP differentiation"
          query: "SELECT name, salary, ceiling, boom_probability, leverage_score, rostership, volatility FROM players WHERE ceiling >= 45 AND rostership <= 10 AND boom_probability >= 15 AND (injury_status IS NULL OR injury_status = '') ORDER BY leverage_score DESC LIMIT 20"

        - description: "Value plays with safe floors (cash game)"
          query: "SELECT name, salary, value, floor, volatility, bust_probability, projected_points FROM players WHERE value >= 5.5 AND floor >= 28 AND volatility < 0.35 AND (injury_status IS NULL OR injury_status = '') ORDER BY value DESC"

        - description: "Players in blowout risk situations"
          query: "SELECT name, team, opponent, vegas_spread, blowout_risk, projected_points, floor, ceiling FROM players WHERE blowout_risk > 0 AND (injury_status IS NULL OR injury_status = '') ORDER BY blowout_risk DESC"

  lineups:
    description: "Saved DFS lineups"
    columns:
      - name: id
        type: INTEGER
      - name: slate_id
        type: TEXT
      - name: name
        type: TEXT
      - name: total_salary
        type: INTEGER
        description: "Sum of all player salaries"
        range: [40000, 50000]
      - name: projected_points
        type: REAL
        description: "Sum of all player projected points"
      - name: created_at
        type: DATETIME
      - name: updated_at
        type: DATETIME

  lineup_players:
    description: "Junction table linking players to lineups"
    columns:
      - name: id
        type: INTEGER
      - name: lineup_id
        type: INTEGER
      - name: player_id
        type: INTEGER
      - name: position_slot
        type: TEXT
        description: "Which roster slot the player fills"
        valid_values: ["PG", "SG", "SF", "PF", "C", "G", "F", "UTIL"]

  chat_sessions:
    description: "AI chat conversation sessions"
    columns:
      - name: id
        type: INTEGER
      - name: title
        type: TEXT
      - name: slate_id
        type: TEXT
      - name: created_at
        type: DATETIME
      - name: updated_at
        type: DATETIME

  chat_messages:
    description: "Individual messages in chat conversations"
    columns:
      - name: id
        type: INTEGER
      - name: session_id
        type: INTEGER
      - name: role
        type: TEXT
        valid_values: ["user", "assistant", "system", "tool"]
      - name: content
        type: TEXT
      - name: metadata
        type: TEXT
        description: "JSON string with additional data"
      - name: ui_blocks
        type: TEXT
        description: "JSON array of typed result blocks (player_list, lineup, ...) streamed with an assistant message"
      - name: created_at
        type: DATETIME

  team_defense_rankings:
    description: "NBA team defensive efficiency and advanced stats (auto-updated from ESPN)"
    columns:
      - name: team
        type: TEXT
        description: "Team abbreviation (3-letter code: LAL, BOS, GSW, etc.)"
        notes: "PRIMARY KEY"
      - name: def_eff
        type: REAL
        description: "Defensive Efficiency - points allowed per 100 possessions"
        range: [102, 124]
        notes: "Lower is better. <106 = elite, 106-110 = good, 110-114 = average, 114-118 = below avg, >118 = poor"
      - name: off_eff
        type: REAL
        description: "Offensive Efficiency - points scored per 100 possessions"
        range: [102, 121]
        notes: "Higher is better"
      - name: pace
        type: REAL
        description: "Possessions per game"
        range: [95, 104]
        notes: "Higher pace = more fantasy opportunities. >102 = fast, 98-102 = average, <98 = slow"
      - name: ast_ratio
        type: REAL
        description: "Assist ratio - percentage of possessions ending in assists"
      - name: to_ratio
        type: REAL
        description: "Turnover ratio - percentage of possessions ending in turnovers"
      - name: rebr
        type: REAL
        description: "Overall rebound rate"
      - name: eff_fg_pct
        type: REAL
        description: "Effective field goal percentage"
      - name: ts_pct
        type: REAL
        description: "True shooting percentage"
      - name: updated_at
        type: DATETIME
        description: "Last update timestamp (auto-refreshed on slate sync)"

    example_queries:
      - description: "Teams with worst defense (easiest matchups)"
        query: "SELECT team, def_eff FROM team_defense_rankings ORDER BY def_eff DESC LIMIT 5"

      - description: "Teams with elite defense (toughest matchups)"
        query: "SELECT team, def_eff FROM team_defense_rankings ORDER BY def_eff ASC LIMIT 5"

      - description: "Fast-pace teams (more opportunities)"
        query: "SELECT team, pace, off_eff FROM team_defense_rankings WHERE pace > 102 ORDER BY pace DESC"

      - description: "Players facing weak defenses"
        query: |
          SELECT p.name, p.team, p.opponent, t.def_eff, p.projected_points
          FROM players p
          JOIN team_defense_rankings t ON p.opponent = t.team
          WHERE t.def_eff > 118
          ORDER BY p.projected_points DESC

      - description: "Players in high-pace games (more fantasy opportunities)"
        query: |
          SELECT p.name, p.team, p.opponent, t.pace, t.off_eff, p.projected_points, p.usage
          FROM players p
          JOIN team_defense_rankings t ON p.opponent = t.team
          WHERE t.pace > 102
          ORDER BY p.projected_points DESC

      - description: "Players on fast-paced teams facing weak defenses"
        query: |
          SELECT p.name, p.team, p.opponent, team_pace.pace as team_pace, opp_def.def_eff, p.projected_points
          FROM players p
          JOIN team_defense_rankings team_pace ON p.team = team_pace.team
          JOIN team_defense_rankings opp_def ON p.opponent = opp_def.team
          WHERE team_pace.pace > 102 AND opp_def.def_eff > 118
          ORDER BY p.projected_points DESC

    notes: |
      - Projections already factor in opponent defense automatically
      - DEF EFF is the most important matchup metric
      - Pace affects volume of fantasy production
      - Data is refreshed from ESPN.com every time a slate is loaded

  team_defense_vs_position:
    description: "Legacy position DVP from HashtagBasketball - REAL points (not fantasy points) each team allows per game to each position. Superseded for matchup analysis by team_archetype_defense"
    columns:
      - name: id
        type: INTEGER
        description: "Auto-increment primary key"
      - name: team
        type: TEXT
        description: "Team abbreviation (3-letter code)"
      - name: position
        type: TEXT
        description: "Position defended against"
        valid_values: ["PG", "SG", "SF", "PF", "C"]
      - name: rank
        type: INTEGER
        description: "Positional defensive rank (1-150, lower is better defense)"
        range: [1, 150]
        notes: "150 positions total (30 teams × 5 positions). ≤40 = elite, 110-150 = weak"
      - name: pts_allowed
        type: REAL
        description: "Real points (not fantasy points) allowed to this position per game"
        range: [18, 28]
        notes: "Higher = easier for offense, but teams are only a few points apart. Compare teams with rank rather than absolute thresholds"
      - name: fg_pct_allowed
        type: REAL
        description: "Field goal percentage allowed to this position"
      - name: tpm_allowed
        type: REAL
        description: "Three-pointers made allowed per game"
      - name: reb_allowed
        type: REAL
        description: "Rebounds allowed per game"
      - name: ast_allowed
        type: REAL
        description: "Assists allowed per game"
      - name: stl_allowed
        type: REAL
        description: "Steals allowed per game"
      - name: blk_allowed
        type: REAL
        description: "Blocks allowed per game"
      - name: to_allowed
        type: REAL
        description: "Turnovers forced per game"
      - name: updated_at
        type: DATETIME
        description: "Last update timestamp"

    example_queries:
      - description: "Find weakest positional defenses (best matchups)"
        query: "SELECT team, position, pts_allowed FROM team_defense_vs_position ORDER BY pts_allowed DESC LIMIT 10"

      - description: "Find toughest matchups for point guards"
        query: "SELECT team, position, pts_allowed, rank FROM team_defense_vs_position WHERE position = 'PG' ORDER BY pts_allowed ASC LIMIT 5"

      - description: "Tonight's players with their legacy positional DVP (primary position = first listed)"
        query: |
          SELECT p.name, p.position, p.opponent, t.pts_allowed, t.rank, p.projected_points
          FROM players p
          JOIN team_defense_vs_position t ON p.opponent = t.team
          WHERE t.position = RTRIM(SUBSTR(p.position, 1, 2), ',/')
          ORDER BY t.rank DESC, p.projected_points DESC

      - description: "All defensive matchups for a specific team"
        query: "SELECT position, pts_allowed, rank FROM team_defense_vs_position WHERE team = 'LAL' ORDER BY position"

    notes: |
      - pts_allowed is REAL points scored by the position, not DraftKings fantasy points
      - Prefer team_archetype_defense for matchups: it is relative to each player's own baseline and is what the projections use
      - Multi-position players (e.g., PG,SG) use their PRIMARY position (first listed)
      - Data is auto-populated from HashtagBasketball.com on slate load
      - Combined with team_defense_rankings.def_eff for complete matchup analysis

  historical_games:
    description: "ESPN box-score game logs, one row per player per game, every game since the 2024-25 season (regular season, play-in and playoffs). Refreshed by the nightly historical sync"
    columns:
      - name: player_key
        type: TEXT
        description: "Accent/punctuation/suffix-free match key ('luka doncic', 'jaren jackson'). Use it to join to player_season_profiles / player_archetypes / slate_player_snapshots"
      - name: player_name
        type: TEXT
        description: "ESPN display name"
      - name: espn_player_id
        type: TEXT
        description: "ESPN athlete id"
      - name: team
        type: TEXT
        description: "Player's team (canonical 3-letter code, same as players.team)"
      - name: opponent
        type: TEXT
        description: "Opponent team code"
      - name: position
        type: TEXT
        description: "ESPN position, mostly G / F / C"
      - name: game_id
        type: TEXT
        description: "ESPN game id"
      - name: game_date
        type: DATE
        description: "Game date (YYYY-MM-DD)"
      - name: season
        type: TEXT
        description: "Season label, e.g. '2025-26'"
      - name: season_type
        type: TEXT
        description: "Game type"
        valid_values: ["regular", "play-in", "playoffs"]
        notes: "Filter season_type = 'regular' for season averages"
      - name: is_home
        type: INTEGER
        description: "1 = home, 0 = away"
      - name: is_starter
        type: INTEGER
        description: "1 = started the game"
      - name: rest_days
        type: INTEGER
        description: "Days since the player's previous game"
      - name: is_back_to_back
        type: INTEGER
        description: "1 = second night of a back-to-back"
      - name: minutes
        type: REAL
        description: "Minutes played (0 = DNP)"
      - name: points
        type: INTEGER
        description: "Points"
      - name: rebounds
        type: INTEGER
        description: "Total rebounds"
      - name: assists
        type: INTEGER
        description: "Assists"
      - name: steals
        type: INTEGER
        description: "Steals"
      - name: blocks
        type: INTEGER
        description: "Blocks"
      - name: turnovers
        type: INTEGER
        description: "Turnovers"
      - name: fg3_made
        type: INTEGER
        description: "Three-pointers made"
      - name: fg_attempted
        type: INTEGER
        description: "Field goal attempts"
      - name: ft_attempted
        type: INTEGER
        description: "Free throw attempts"
      - name: ts_pct
        type: REAL
        description: "True shooting % for the game"
      - name: dk_fantasy_points
        type: REAL
        description: "DraftKings fantasy points scored"
      - name: fd_fantasy_points
        type: REAL
        description: "FanDuel fantasy points scored"
      - name: yahoo_fantasy_points
        type: REAL
        description: "Yahoo fantasy points scored"

    example_queries:
      - description: "A player's last 10 games"
        query: "SELECT game_date, opponent, minutes, points, rebounds, assists, dk_fantasy_points FROM historical_games WHERE player_key = 'jalen brunson' AND minutes > 0 ORDER BY game_date DESC LIMIT 10"

      - description: "Season averages for tonight's players (regular season)"
        query: |
          SELECT p.name, h.season, COUNT(*) AS games, ROUND(AVG(h.minutes), 1) AS mpg,
                 ROUND(AVG(h.dk_fantasy_points), 1) AS avg_dk
          FROM players p
          JOIN historical_games h ON (h.player_key = LOWER(p.name) OR h.player_name = p.name)
          WHERE h.season_type = 'regular' AND h.minutes > 0
          GROUP BY p.name, h.season
          ORDER BY p.name, h.season DESC

      - description: "Back-to-back split for a player"
        query: "SELECT is_back_to_back, COUNT(*) AS games, ROUND(AVG(dk_fantasy_points), 1) AS avg_dk FROM historical_games WHERE player_key = 'jalen brunson' AND season_type = 'regular' AND minutes > 0 GROUP BY is_back_to_back"

    notes: |
      - usg_pct, off_rtg, def_rtg, bpm, ast_pct and the other rate columns are EMPTY (ESPN does not provide them). Use player_season_profiles for usage and rates
      - player_id is empty; identify players by player_key
      - Rows with minutes = 0 are DNPs; exclude them from averages

  slate_player_snapshots:
    description: "Copy of every synced slate's player rows (a slate sync wipes players and slates). One row per (game_date, site, slate_id, player_key) with the latest pre-game salary, projection, ownership, Vegas and injury values. Join to historical_games on player_key + game_date for actual results"
    columns:
      - name: game_date
        type: DATE
        description: "Date the slate's games are played"
      - name: snapshot_date
        type: DATE
        description: "Date the snapshot was taken"
      - name: slate_id
        type: TEXT
        description: "Slate identifier"
      - name: site
        type: TEXT
        description: "DFS site"
        valid_values: ["draftkings", "fanduel", "yahoo"]
      - name: player_key
        type: TEXT
        description: "Match key (same as historical_games.player_key)"
      - name: player_name
        type: TEXT
        description: "Player name as synced"
      - name: team
        type: TEXT
        description: "Team code"
      - name: opponent
        type: TEXT
        description: "Opponent team code"
      - name: position
        type: TEXT
        description: "Site position(s)"
      - name: salary
        type: INTEGER
        description: "Salary on that slate"
      - name: projected_points
        type: REAL
        description: "Projection at the last sync"
      - name: projected_minutes
        type: REAL
        description: "Projected minutes"
      - name: floor
        type: REAL
        description: "Projected floor"
      - name: ceiling
        type: REAL
        description: "Projected ceiling"
      - name: rostership
        type: REAL
        description: "Projected ownership % (not actual ownership)"
      - name: vegas_implied_total
        type: REAL
        description: "Team implied total"
      - name: vegas_spread
        type: REAL
        description: "Point spread"
      - name: over_under
        type: REAL
        description: "Game total"
      - name: injury_status
        type: TEXT
        description: "Injury status at the last sync"
      - name: is_confirmed
        type: INTEGER
        description: "1 = lineup confirmed"
      - name: captured_at
        type: DATETIME
        description: "When the row was last written"

    example_queries:
      - description: "Projection vs actual DK points for past slates"
        query: |
          SELECT s.game_date, s.player_name, s.salary, s.projected_points,
                 h.dk_fantasy_points AS actual, ROUND(h.dk_fantasy_points - s.projected_points, 1) AS diff
          FROM slate_player_snapshots s
          JOIN historical_games h ON h.player_key = s.player_key AND h.game_date = s.game_date
          WHERE s.site = 'draftkings'
          ORDER BY s.game_date DESC, diff DESC
          LIMIT 20

    notes: |
      - Only slates synced since snapshots were added are here; it may be empty or short
      - rostership is projected ownership, not actual contest ownership

  player_season_profiles:
    description: "Per-season regular-season role profile per player, computed in-house from historical_games. One row per (season, player_key). Rates are FRACTIONS (0.31 = 31%)"
    columns:
      - name: season
        type: TEXT
        description: "Season label, e.g. '2025-26'"
      - name: player_key
        type: TEXT
        description: "Match key"
      - name: player_name
        type: TEXT
        description: "Player name"
      - name: team
        type: TEXT
        description: "Latest team that season"
      - name: teams
        type: TEXT
        description: "Every team that season, in order"
      - name: position
        type: TEXT
        description: "ESPN position (G / F / C)"
      - name: games
        type: INTEGER
        description: "Games played"
      - name: starts
        type: INTEGER
        description: "Games started"
      - name: minutes_pg
        type: REAL
        description: "Minutes per game"
      - name: usg_pct
        type: REAL
        description: "Usage rate (fraction)"
        notes: "Median ~0.18, 90th percentile ~0.27"
      - name: ast_pct
        type: REAL
        description: "Assist rate (fraction)"
      - name: reb_pct
        type: REAL
        description: "Total rebound rate (fraction)"
      - name: stl_pct
        type: REAL
        description: "Steal rate (fraction)"
      - name: blk_pct
        type: REAL
        description: "Block rate (fraction)"
      - name: three_pa_rate
        type: REAL
        description: "Share of shots that are threes (fraction)"
      - name: ts_pct
        type: REAL
        description: "True shooting (fraction)"
      - name: dk_fppm
        type: REAL
        description: "DraftKings fantasy points per minute"
      - name: fd_fppm
        type: REAL
        description: "FanDuel fantasy points per minute"
      - name: pts_per36
        type: REAL
        description: "Points per 36 minutes"
      - name: reb_per36
        type: REAL
        description: "Rebounds per 36 minutes"
      - name: ast_per36
        type: REAL
        description: "Assists per 36 minutes"
      - name: fg3m_per36
        type: REAL
        description: "Threes made per 36 minutes"

    example_queries:
      - description: "Highest-usage players last season (20+ games)"
        query: "SELECT player_name, team, games, minutes_pg, ROUND(usg_pct * 100, 1) AS usg, dk_fppm FROM player_season_profiles WHERE season = '2025-26' AND games >= 20 ORDER BY usg_pct DESC LIMIT 15"

      - description: "Profiles for tonight's players"
        query: |
          SELECT p.name, sp.season, sp.minutes_pg, ROUND(sp.usg_pct * 100, 1) AS usg, sp.dk_fppm
          FROM players p
          JOIN player_season_profiles sp ON (sp.player_key = LOWER(p.name) OR sp.player_name = p.name)
          ORDER BY p.name, sp.season DESC

  player_archetypes:
    description: "Per-season archetype per player, classified from player_season_profiles by rules in config/archetypes.js. One row per (season, player_key)"
    columns:
      - name: season
        type: TEXT
        description: "Season label"
      - name: player_key
        type: TEXT
        description: "Match key"
      - name: archetype
        type: TEXT
        description: "Primary archetype key"
        valid_values: ["primary_creator", "point_forward", "scoring_guard", "bench_scorer", "stretch_big", "rim_running_big", "three_and_d_wing", "spot_up_shooter", "role_player", "unclassified"]
        notes: "unclassified = below 10 games / 200 minutes that season; use the prior season's archetype instead"
      - name: secondary_archetype
        type: TEXT
        description: "Next matching archetype, if any"
      - name: rule_trace
        type: TEXT
        description: "JSON explaining which rules passed/failed"

    example_queries:
      - description: "Archetypes of tonight's players"
        query: |
          SELECT p.name, a.season, a.archetype, a.secondary_archetype
          FROM players p
          JOIN player_season_profiles sp ON (sp.player_key = LOWER(p.name) OR sp.player_name = p.name)
          JOIN player_archetypes a ON a.player_key = sp.player_key AND a.season = sp.season
          ORDER BY p.name, a.season DESC

  team_archetype_defense:
    description: "How each defense performs against each player archetype (group_by 'archetype') and each G/F/C position (group_by 'position', in-house DvP), RELATIVE TO EXPECTATION: each player-game is compared with that player's own season-to-date per-minute rate x actual minutes. Full-season numbers per (season, site, group_by, team, group_key). This is what the projection DVP adjustment uses"
    columns:
      - name: season
        type: TEXT
        description: "Season label"
      - name: site
        type: TEXT
        description: "DFS scoring"
        valid_values: ["draftkings", "fanduel", "yahoo"]
      - name: group_by
        type: TEXT
        description: "Grouping"
        valid_values: ["archetype", "position"]
      - name: team
        type: TEXT
        description: "DEFENDING team code (match to players.opponent)"
      - name: group_key
        type: TEXT
        description: "Archetype key (see player_archetypes.archetype) or G / F / C"
      - name: games
        type: INTEGER
        description: "Distinct games in the sample"
        notes: "Under ~10 games the numbers are mostly shrunk toward 0"
      - name: player_games
        type: INTEGER
        description: "Player-games in the sample"
      - name: avg_minutes
        type: REAL
        description: "Average minutes per player-game"
      - name: avg_fp
        type: REAL
        description: "Average actual fantasy points per player-game"
      - name: avg_expected_fp
        type: REAL
        description: "Average expected fantasy points per player-game"
      - name: fp_over_expectation
        type: REAL
        description: "KEY METRIC: fantasy points per player-game allowed above (+) or below (-) expectation, shrunk toward 0 by games / (games + 10)"
        range: [-6, 7]
        notes: "+1.5 or more = soft spot, -1.5 or less = tough. Compare within a group_key"
      - name: fp_over_expectation_raw
        type: REAL
        description: "Same before shrinkage"
      - name: shrink
        type: REAL
        description: "Shrink factor applied (games / (games + 10))"
      - name: pts_delta
        type: REAL
        description: "Real points per player-game over expectation (shrunk)"
      - name: reb_delta
        type: REAL
        description: "Rebounds over expectation (shrunk)"
      - name: ast_delta
        type: REAL
        description: "Assists over expectation (shrunk)"
      - name: fg3m_delta
        type: REAL
        description: "Threes made over expectation (shrunk)"
      - name: stocks_delta
        type: REAL
        description: "Steals + blocks over expectation (shrunk)"

    example_queries:
      - description: "Softest defenses vs Primary Creators on DraftKings"
        query: "SELECT team, games, ROUND(fp_over_expectation, 2) AS fp_over_exp, ROUND(ast_delta, 2) AS ast_delta FROM team_archetype_defense WHERE season = '2025-26' AND site = 'draftkings' AND group_by = 'archetype' AND group_key = 'primary_creator' ORDER BY fp_over_expectation DESC LIMIT 10"

      - description: "In-house G/F/C DvP for one defense"
        query: "SELECT group_key, games, ROUND(fp_over_expectation, 2) AS fp_over_exp, ROUND(reb_delta, 2) AS reb_delta FROM team_archetype_defense WHERE season = '2025-26' AND site = 'draftkings' AND group_by = 'position' AND team = 'LAL'"

      - description: "Which season to use (latest with 20+ defenses at 10+ games)"
        query: "SELECT season FROM team_archetype_defense WHERE group_by = 'position' AND site = 'draftkings' AND games >= 10 GROUP BY season HAVING COUNT(DISTINCT team) >= 20 ORDER BY season DESC LIMIT 1"

    notes: |
      - Always filter site, season and group_by; otherwise rows from every site/season/grouping mix together
      - Early in a season the current season is thin; use the prior season until 20+ defenses have 10+ games
      - Positions are ESPN's coarse G / F / C, not PG/SG/SF/PF/C
      - Player -> archetype: players -> player_season_profiles (player_key from the tools; a name join is approximate) -> player_archetypes (same season)

# DFS Constraints (DraftKings)
dfs_rules:
  salary_cap: 50000
  roster_size: 8
  positions:
    - name: PG
      description: "Point Guard"
      required: 1
    - name: SG
      description: "Shooting Guard"
      required: 1
    - name: SF
      description: "Small Forward"
      required: 1
    - name: PF
      description: "Power Forward"
      required: 1
    - name: C
      description: "Center"
      required: 1
    - name: G
      description: "Guard Flex (PG or SG)"
      required: 1
    - name: F
      description: "Forward Flex (SF or PF)"
      required: 1
    - name: UTIL
      description: "Utility (Any position)"
      required: 1

# Important Query Tips
query_tips:
  - "ALWAYS filter out injured players with: WHERE (injury_status IS NULL OR injury_status = '')"
  - "There is NO 'ACTIVE' status - healthy players have NULL or empty injury_status"
  - "For 'top tier' players, use salary >= 9000 or projected_points >= 45"
  - "For 'value plays', look for value >= 5.5 or value_gpp >= 6.0"
  - "Position filtering: use LIKE operator (e.g., WHERE position LIKE '%PG%')"
  - "High ownership = rostership >= 25, Low ownership = rostership <= 10"
  - "Team abbreviations: LAL, BOS, GSW, MIA, etc. (3-letter uppercase)"
  - "Always order by projected_points DESC or value DESC for best results"
  - "Matchups: use team_archetype_defense.fp_over_expectation (fantasy points per player-game above/below expectation, + = soft). Join players -> player_season_profiles -> player_archetypes -> team_archetype_defense"
  - "team_archetype_defense: filter site ('draftkings'/'fanduel'/'yahoo'), season and group_by ('archetype' or 'position'). Check games: under ~10 the value is heavily shrunk toward 0"
  - "Early in a season use the prior season for team_archetype_defense until 20+ defenses have 10+ games in the current one"
  - "dvp_pts_allowed / team_defense_vs_position.pts_allowed are REAL points (about 18-28), NOT fantasy points"
  - "opp_def_eff: Higher is better for offense (weaker defense to face)"
  - "Player names: resolve them to player_key with the tools (get_player_history, compare_players, get_usage_without_teammate, ...) or the player_key utility (utils/playerKey.js); they handle accents, punctuation and Jr./III and return closest matches. Then filter history tables by player_key, never player_name LIKE '%name%'. The slate-wide example joins on name are approximate and can miss players"
  - "historical_games has every game since 2024-25; filter season_type = 'regular' for season averages. usg_pct/off_rtg/def_rtg/bpm are empty there - use player_season_profiles"
  # Advanced metrics tips
  - "CASH GAMES: Filter by floor >= 30 AND volatility < 0.30 AND bust_probability < 45"
  - "GPP TOURNAMENTS: Sort by leverage_score DESC for maximum differentiation"
  - "Elite leverage plays: leverage_score >= 3.0 (low owned + high boom potential)"
  - "Safe plays: floor >= 30 AND volatility < 0.30"
  - "High ceiling plays: ceiling >= 50 AND boom_probability >= 25"
  - "Consistent producers: volatility < 0.30 (low variance)"
  - "Boom/bust candidates: volatility >= 0.45 (high variance, good for GPP if low owned)"
  - "Low bust risk: bust_probability < 40 (safe for cash)"
  - "High boom potential: boom_probability >= 25 (great for GPP)"
  - "leverage_score is THE PRIMARY metric for GPP optimization"
  - "Blowout risk > 0 means spread is >10 points (starters may get pulled early)"

# Strategy Insights
dfs_strategy:
  cash_games:
    focus: "Safety, high floor, low volatility, low bust risk"
    metrics: ["floor >= 30", "volatility < 0.30", "bust_probability < 45", "value >= 5.5"]
    sql_example: "WHERE floor >= 30 AND volatility < 0.30 AND bust_probability < 45 AND projected_minutes >= 28 ORDER BY floor DESC"
    explanation: "Cash games reward consistency. Prioritize high floors and low variance to minimize downside risk."

  gpp_tournaments:
    focus: "Upside, ceiling, leverage, differentiation, boom potential"
    metrics: ["leverage_score >= 3.0", "ceiling >= 50", "boom_probability >= 25", "rostership <= 15"]
    sql_example: "WHERE leverage_score >= 3.0 AND ceiling >= 50 AND boom_probability >= 25 ORDER BY leverage_score DESC"
    explanation: "GPPs reward differentiation. Target low-owned players with high boom probability for maximum leverage."

  game_stacking:
    description: "Select multiple players from same game for correlated upside"
    sql_example: "WHERE (team = 'LAL' OR opponent = 'LAL') AND vegas_over_under >= 225"

  leverage_plays:
    description: "Contrarian plays with low ownership but high upside - USE leverage_score!"
    sql_example: "WHERE leverage_score >= 3.0 AND boom_probability >= 20 AND rostership <= 10 ORDER BY leverage_score DESC"
    explanation: "leverage_score is calculated as boom_probability / (ownership + 1). Higher = better GPP value."

  pace_upside:
    description: "Target high-pace games for increased volume and fantasy opportunities"
    explanation: "Faster pace = more possessions = more stats = higher fantasy points"
    sql_example: |
      SELECT p.name, p.projected_points, t.pace
      FROM players p
      JOIN team_defense_rankings t ON p.opponent = t.team
      WHERE t.pace > 102 AND p.projected_minutes >= 28
      ORDER BY t.pace DESC, p.projected_points DESC

  matchup_stacking:
    description: "Combine archetype defense and pace for elite matchup spots"
    sql_example: |
      SELECT p.name, p.salary, a.archetype, ROUND(d.fp_over_expectation, 2) AS fp_over_expectation, t.pace, p.projected_points
      FROM players p
      JOIN player_season_profiles sp ON (sp.player_key = LOWER(p.name) OR sp.player_name = p.name)
      JOIN player_archetypes a ON a.player_key = sp.player_key AND a.season = sp.season
      JOIN team_archetype_defense d ON d.team = p.opponent AND d.season = a.season
        AND d.site = 'draftkings' AND d.group_by = 'archetype' AND d.group_key = a.archetype
      JOIN team_defense_rankings t ON p.opponent = t.team
      WHERE d.season = (SELECT season FROM team_archetype_defense
                        WHERE group_by = 'position' AND site = 'draftkings' AND games >= 10
                        GROUP BY season HAVING COUNT(DISTINCT team) >= 20
                        ORDER BY season DESC LIMIT 1)
        AND d.fp_over_expectation >= 1 AND t.pace > 100
      ORDER BY p.value_gpp DESC
