name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # package-lock.json is gitignored, so install fresh from package.json.
      # legacy-peer-deps matches backend/.npmrc (langchain peer ranges).
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run tests
        run: npm test
